<!DOCTYPE html><html lang="ja" data-astro-cid-ibpinaeu><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex"><title>ページが見つかりません - CyPedia</title><style>body{max-width:820px;margin:70px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans JP,sans-serif;line-height:1.7}a[data-astro-cid-ibpinaeu]{color:#36c}h1[data-astro-cid-ibpinaeu]{border-bottom:1px solid #a2a9b1}
</style></head><body data-astro-cid-ibpinaeu><h1 data-astro-cid-ibpinaeu>ページが見つかりません</h1><p data-astro-cid-ibpinaeu>指定されたCyPediaの項目は存在しません。</p><p id="suggestion" data-astro-cid-ibpinaeu></p><p data-astro-cid-ibpinaeu><a id="search-link" href="/cypedia/ja/search/" data-astro-cid-ibpinaeu>CyPediaを検索</a>/<a href="/cypedia/ja/" data-astro-cid-ibpinaeu>トップページ</a></p><script>(function(){const base = "/cypedia/";

    const path =
      window.location.pathname;

    const isEnglish =
      path.includes('/en/');

    const pieces =
      path
        .split('/')
        .filter(Boolean);

    const term =
      decodeURIComponent(
        pieces.at(-1) ?? ''
      )
        .replaceAll('-', ' ')
        .trim();

    const lang =
      isEnglish ? 'en' : 'ja';

    const search =
      document.getElementById(
        'search-link'
      );

    const suggestion =
      document.getElementById(
        'suggestion'
      );

    if (isEnglish) {
      document.documentElement.lang = 'en';
      document.title =
        'Page not found - CyPedia';

      document.querySelector('h1')
        .textContent =
          'Page not found';

      document.querySelector('body > p')
        .textContent =
          'The requested CyPedia entry does not exist.';

      search.textContent =
        'Search CyPedia';
    }

    if (term) {
      search.href =
        `${base}${lang}/search/?q=` +
        encodeURIComponent(term);

      suggestion.textContent =
        isEnglish
          ? `Search for "${term}" instead.`
          : `「${term}」を検索できます。`;
    } else {
      search.href =
        `${base}${lang}/search/`;
    }
  })();</script></body></html>
